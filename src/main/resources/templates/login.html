<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CoupleTour - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center py-4">

<main class="container" style="max-width: 900px;">
    <div class="row g-0 shadow rounded-4 overflow-hidden bg-white">
        
        <!-- Sidebar Brand -->
        <div class="col-md-5 bg-dark text-white p-5 d-flex flex-column justify-content-between">
            <div>
                <h3 class="fw-bold text-danger mb-0">CoupleTour</h3>
                <small class="text-secondary">Conectando experiências</small>
            </div>
            <div class="my-4">
                <h4 class="fw-semibold">Que bom ter você de volta!</h4>
            </div>
            <div>
                <small class="text-muted">&copy; 2026 CoupleTour</small>
            </div>
        </div>

        <!-- Form Section -->
        <div class="col-md-7 p-4 p-md-5">
            <h2 class="fw-bold mb-1">Entrar na conta</h2>
            <p class="text-muted mb-4">Insira seus dados para continuar.</p>

            <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>

            <form th:action="@{/login}" th:object="${auth}" method="post" novalidate>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" th:field="*{email}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                           placeholder="voce@exemplo.com" required />
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-4">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" id="senha" th:field="*{senha}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'"
                           placeholder="Sua senha" required />
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
                </div>

                <button type="submit" class="btn btn-danger w-100 py-2 fw-bold mb-3">Entrar</button>

                <div class="text-center">
                    <small class="text-muted">Ainda não tem conta? <a th:href="@{/cadastro}" class="text-danger fw-semibold text-decoration-none">Cadastre-se</a></small>
                </div>
            </form>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></script>
</body>
</html>
