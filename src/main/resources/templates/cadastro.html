<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CoupleTour - Cadastro de Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center py-4">

<main class="container" style="max-width: 900px;">
    <div class="row g-0 shadow rounded-4 overflow-hidden bg-white">
        
        <div class="col-md-5 bg-dark text-white p-5 d-flex flex-column justify-content-between">
            <div>
                <h3 class="fw-bold text-danger mb-0">CoupleTour</h3>
                <small class="text-secondary">Conectando experiências</small>
            </div>
            <div class="my-4">
                <h4 class="fw-semibold">Todos os rolês de vocês em um só lugar.</h4>
            </div>
            <div>
                <small class="text-muted">&copy; 2026 CoupleTour</small>
            </div>
        </div>

        <div class="col-md-7 p-4 p-md-5">
            <h2 class="fw-bold mb-1">Crie sua conta</h2>
            <p class="text-muted mb-4">Depois do cadastro, é só vincular seu par.</p>

            <div th:if="${sucesso}" class="alert alert-success" role="alert" th:text="${sucesso}"></div>

            <form th:action="@{/cadastro}" th:object="${usuario}" method="post" novalidate>

                <div class="mb-3">
                    <label for="nome" class="form-label font-weight-bold">Nome</label>
                    <input type="text" id="nome" th:field="*{nome}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                           placeholder="Como você quer ser chamado(a)" required />
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" th:field="*{email}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                           placeholder="voce@exemplo.com" required />
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" id="senha" th:field="*{senha}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'"
                           placeholder="Crie uma senha" required />
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="dataNascimento" class="form-label">Data de nascimento</label>
                        <input type="date" id="dataNascimento" th:field="*{dataNascimento}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('dataNascimento')} ? 'is-invalid'"
                               required />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('dataNascimento')}" th:errors="*{dataNascimento}"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="pronomeId" class="form-label">Pronome</label>
                        <select id="pronomeId" th:field="*{pronomeId}"
                                class="form-select"
                                th:classappend="${#fields.hasErrors('pronomeId')} ? 'is-invalid'"
                                required>
                            <option value="">Selecione...</option>
                            <option th:each="p : ${pronomesList}"
                                    th:value="${p.id}"
                                    th:text="${p.textoExibicao}">
                            </option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('pronomeId')}" th:errors="*{pronomeId}"></div>
                    </div>
                </div>

                <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">Criar conta</button>
            </form>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
