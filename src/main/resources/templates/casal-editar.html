<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Perfil do Casal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex flex-column align-items-center py-5">

<div class="container bg-white p-5 rounded-4 shadow position-relative" style="max-width: 700px;">

    <a href="/feed" class="position-absolute top-0 start-0 m-4 text-decoration-none text-secondary">
        &larr; Voltar
    </a>

    <h2 class="fw-bold text-danger mb-4 text-center">Editar Minha Metade do Perfil</h2>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="alert alert-info">
        Responda as perguntas abaixo sobre o seu parceiro(a). Essas respostas aparecerão no perfil público do casal!
    </div>

    <form action="/casal/editar" method="POST" enctype="multipart/form-data" th:object="${editDTO}">

        <div class="mb-4 text-center">
            <label for="fotoPerfil" class="form-label fw-bold d-block">Sua Foto de Perfil</label>
            <input class="form-control" type="file" id="fotoPerfil" name="fotoPerfil" accept="image/png, image/jpeg">
            <small class="text-muted">Aparecerá redondinha ao lado da foto do seu parceiro(a) no cabeçalho.</small>
        </div>

        <div class="mb-4">
            <label for="resposta1" class="form-label fw-bold text-danger" th:text="*{label1}">Pergunta 1</label>
            <textarea class="form-control" id="resposta1" name="resposta1" th:field="*{resposta1}" rows="3" required></textarea>
        </div>

        <div class="mb-4">
            <label for="resposta2" class="form-label fw-bold text-danger" th:text="*{label2}">Pergunta 2</label>
            <textarea class="form-control" id="resposta2" name="resposta2" th:field="*{resposta2}" rows="3" required></textarea>
        </div>

        <div class="mb-4">
            <label for="resposta3" class="form-label fw-bold text-danger" th:text="*{label3}">Pergunta 3</label>
            <textarea class="form-control" id="resposta3" name="resposta3" th:field="*{resposta3}" rows="3" required></textarea>
        </div>

        <button type="submit" class="btn btn-danger w-100 fw-bold py-2">Salvar Perfil</button>
    </form>
</div>

</body>
</html>
