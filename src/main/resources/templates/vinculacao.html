<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CoupleTour - Vinculação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light min-vh-100 p-5">

<div class="container bg-white p-5 rounded-4 shadow text-center position-relative" style="max-width: 600px;">
    
    <a href="/feed" class="position-absolute top-0 start-0 m-4 text-decoration-none text-secondary d-flex align-items-center fw-semibold transition-opacity" 
       style="opacity: 0.7;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.7'">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="me-1" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/>
        </svg>
        Voltar
    </a>
    <h2 class="fw-bold text-danger mb-4">Vincule seu amor!</h2>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    
    <p class="mb-2">Olá, <strong th:text="${usuarioNome}">Usuário</strong>!</p>
    <p class="text-secondary mb-4">Compartilhe seu token ou insira o do seu parceire.</p>

    <div class="mb-4">
        <h5>Seu Token:</h5>
        <div class="display-5 fw-bold text-danger bg-light p-3 border rounded d-inline-block letter-spacing-1"
             th:text="${usuarioUniqueToken}">
            ABCD
        </div>
    </div>

    <hr class="my-4">

    <form action="/vinculacao" method="POST">
        <div class="mb-4">
            <label class="form-label fw-semibold">Token do(a) Parceire</label>
            <div class="d-flex justify-content-center gap-3">
                <input type="text" class="form-control text-center fs-2 fw-bold text-uppercase token-input shadow-sm" maxlength="1" style="width: 70px; height: 70px;" required>
                <input type="text" class="form-control text-center fs-2 fw-bold text-uppercase token-input shadow-sm" maxlength="1" style="width: 70px; height: 70px;" required>
                <input type="text" class="form-control text-center fs-2 fw-bold text-uppercase token-input shadow-sm" maxlength="1" style="width: 70px; height: 70px;" required>
                <input type="text" class="form-control text-center fs-2 fw-bold text-uppercase token-input shadow-sm" maxlength="1" style="width: 70px; height: 70px;" required>
            </div>
            <input type="hidden" id="tokenParceiro" name="tokenParceiro" required>
        </div>
        <button type="submit" class="btn btn-danger w-100 fs-5">Vincular</button>
    </form>
</div>

<script>
    const inputs = document.querySelectorAll('.token-input');
    const hiddenInput = document.getElementById('tokenParceiro');

    inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
            if (e.target.value.length === 1 && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }
            updateHidden();
        });
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                inputs[index - 1].focus();
            }
            setTimeout(updateHidden, 10);
        });
    });

    function updateHidden() {
        hiddenInput.value = Array.from(inputs).map(i => i.value).join('');
    }
</script>
</body>
</html>
