<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nova Postagem - CoupleTour</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" rel="stylesheet" />
</head>
<body class="bg-light min-vh-100 d-flex flex-column align-items-center py-5">

<div class="container bg-white p-5 rounded-4 shadow position-relative" style="max-width: 800px;">

    <a href="/feed" class="position-absolute top-0 start-0 m-4 text-decoration-none text-secondary d-flex align-items-center fw-semibold transition-opacity" 
       style="opacity: 0.7;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.7'">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="me-1" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/>
        </svg>
        Voltar
    </a>

    <h2 class="fw-bold text-danger mb-4 text-center">Avaliar um Rolê</h2>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <form action="/postagem/nova" method="POST" enctype="multipart/form-data" th:object="${postagemDTO}">

        <div class="mb-4">
            <label for="lugarId" class="form-label fw-bold">Onde vocês foram?</label>
            <select class="form-select select2-lugares" id="lugarId" name="lugarId" required>
                <option value="">Selecione o local...</option>
                <option th:each="lugar : ${lugares}" th:value="${lugar.id}" th:text="${lugar.nome + ' (' + lugar.categoria.nome + ')'}"></option>
            </select>
        </div>

        <hr class="my-4">

        <h5 class="fw-bold text-secondary mb-3">Notas da Experiência (0.0 a 10.0)</h5>

        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label for="nota1" class="form-label fw-semibold small">1. Qual a sua nota para a atmosfera, conforto e a "vibe" do local para um casal?</label>
                <input type="number" class="form-control" id="nota1" name="nota1" min="0" max="10" step="0.5" required>
            </div>

            <div class="col-md-6">
                <label for="nota2" class="form-label fw-semibold small">2. Como você avalia a qualidade do atendimento, organização e limpeza do estabelecimento?</label>
                <input type="number" class="form-control" id="nota2" name="nota2" min="0" max="10" step="0.5" required>
            </div>

            <div class="col-md-6">
                <label for="nota3" class="form-label fw-semibold small">3. Qual a nota para o custo-benefício dessa experiência (dinheiro/tempo investido)?</label>
                <input type="number" class="form-control" id="nota3" name="nota3" min="0" max="10" step="0.5" required>
            </div>

            <div class="col-md-6">
                <label for="nota4" class="form-label fw-semibold small">4. O quanto esse rolê fortaleceu a conexão, o romance ou a diversão entre vocês?</label>
                <input type="number" class="form-control" id="nota4" name="nota4" min="0" max="10" step="0.5" required>
            </div>
        </div>

        <hr class="my-4">

        <div class="mb-4">
            <label for="descricao" class="form-label fw-bold">Descrição / Review (Opcional)</label>
            <textarea class="form-control" id="descricao" name="descricao" rows="3" placeholder="Conte como foi a experiência de vocês..."></textarea>
        </div>

        <div class="mb-4">
            <label for="fotos" class="form-label fw-bold">Fotos (Opcional, múltipla seleção)</label>
            <input class="form-control" type="file" id="fotos" name="fotos" accept="image/png, image/jpeg, image/jpg" multiple>
        </div>

        <div class="form-check form-switch mb-4">
            <input class="form-check-input" type="checkbox" id="postVisibility" name="postVisibility" value="true" checked>
            <input type="hidden" name="_postVisibility" value="on">
            <label class="form-check-label fw-semibold" for="postVisibility">Deixar visível no feed público (se desmarcado, fica apenas para vocês na Página do Casal)</label>
        </div>

        <button type="submit" class="btn btn-danger w-100 fw-bold py-2">Publicar Avaliação</button>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
    $(document).ready(function() {
        $('.select2-lugares').select2({
            theme: 'bootstrap-5',
            placeholder: "Pesquise um lugar...",
            allowClear: true
        });
    });
</script>
</body>
</html>
